<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007aff">
  <title>学习中心 - Hankilab 学习中心</title>
  <link rel="stylesheet" href="css/style.css?v=20260528">
  <link rel="stylesheet" href="css/practice.css?v=20260528">
</head>
<body>
  <div id="app">
    <!-- 页面头部 -->
    <header class="practice-header">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 19l-7-7 7-7"/>
        </svg>
        <span>返回应用</span>
      </a>
      <h1 class="page-title">学习中心</h1>
    </header>

    <!-- 主要内容区 -->
    <main class="practice-main">
      <!-- 学习概览 -->
      <section class="learning-overview">
        <h2><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px"><path d="M18 3v18M6 14v4M12 10v8M24 6v12"/></svg>学习概览</h2>
        <div class="overview-grid">
          <div class="overview-card">
            <div class="overview-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a5 5 0 005 5h4a5 5 0 005-5V9a2 2 0 00-2-2V7a5 5 0 00-5-5z"/><path d="M12 4v8M9 8h6"/></svg></div>
            <div class="overview-value" id="streakDays">0 天</div>
            <div class="overview-label">连续学习</div>
          </div>
          <div class="overview-card">
            <div class="overview-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div>
            <div class="overview-value" id="masteredCount">0 课</div>
            <div class="overview-label">已掌握</div>
          </div>
          <div class="overview-card">
            <div class="overview-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></div>
            <div class="overview-value" id="avgAccuracy">0%</div>
            <div class="overview-label">平均正确率</div>
          </div>
        </div>
        <p class="hint" style="text-align:center;color:var(--text-secondary);font-size:0.85rem;margin-top:16px">
          💡 查看详细学习报告，请返回 <a href="index.html" style="color:var(--primary);text-decoration:none">主应用 → 用户中心</a>
        </p>
      </section>

      <!-- 听读训练 -->
      <section class="practice-section">
        <h2><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px"><path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>听读训练</h2>
        <div class="practice-grid">
          <!-- 流程 1：听音辨意 -->
          <div class="practice-card" data-type="listening" onclick="startPractice('listening')">
            <div class="practice-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16a5 5 0 005 5h1a5 5 0 005-5v-2a2 2 0 00-2-2 2 2 0 00-2 2v2a1 1 0 01-1 1h-1a1 1 0 01-1-1V4a1 1 0 011-1h1a1 1 0 011 1v2h2V4a3 3 0 00-3-3h-1a3 3 0 00-3 3z"/><circle cx="12" cy="13" r="2"/></svg></div>
            <h3>听音辨意</h3>
            <p class="practice-desc">听音频选择正确含义</p>
            <div class="practice-stats">
              <span class="star-rating" id="listeningStars">★★★★★</span>
              <span class="remaining-count" id="listeningRemaining">剩余 0 课</span>
            </div>
          </div>

          <!-- 流程 2：跟读模仿 -->
          <div class="practice-card" data-type="speaking" onclick="startPractice('speaking')">
            <div class="practice-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg></div>
            <h3>跟读模仿</h3>
            <p class="practice-desc">跟读句子并录音</p>
            <div class="practice-stats">
              <span class="star-rating" id="speakingStars">★★★★★</span>
              <span class="remaining-count" id="speakingRemaining">剩余 0 课</span>
            </div>
          </div>

          <!-- 流程 3：补全训练 -->
          <div class="practice-card" data-type="fillBlank" onclick="startPractice('fillBlank')">
            <div class="practice-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M9 18v3M15 18v3M12 18v3M5 6V3M19 6V3"/></svg></div>
            <h3>补全训练</h3>
            <p class="practice-desc">补全句中缺失单词</p>
            <div class="practice-stats">
              <span class="star-rating" id="fillBlankStars">★★★★★</span>
              <span class="remaining-count" id="fillBlankRemaining">剩余 0 课</span>
            </div>
          </div>

          <!-- 流程 4：句子重组 -->
          <div class="practice-card" data-type="ordering" onclick="startPractice('ordering')">
            <div class="practice-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 10H3"/><path d="M21 6l-4 4 4 4"/><path d="M7 14H21"/><path d="M3 18l4-4-4-4"/></svg></div>
            <h3>句子重组</h3>
            <p class="practice-desc">拖拽单词组成句子</p>
            <div class="practice-stats">
              <span class="star-rating" id="orderingStars">★★★★★</span>
              <span class="remaining-count" id="orderingRemaining">剩余 0 课</span>
            </div>
          </div>

          <!-- 流程 5：翻译练习 -->
          <div class="practice-card" data-type="translation" onclick="startPractice('translation')">
            <div class="practice-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg></div>
            <h3>翻译练习</h3>
            <p class="practice-desc">中译英 / 英译中</p>
            <div class="practice-stats">
              <span class="star-rating" id="translationStars">★★★★★</span>
              <span class="remaining-count" id="translationRemaining">剩余 0 课</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 学习详情入口 -->
      <section class="learning-report-section">
        <h2><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>学习详情</h2>
        <div class="report-preview" id="reportPreview">
          <div class="report-preview-item">
            <span class="label">本周学习</span>
            <span class="value">0 分钟</span>
          </div>
          <div class="report-preview-item">
            <span class="label">掌握进度</span>
            <span class="value">0/0 课</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 练习界面（隐藏，点击练习时显示）- 卡片左右翻页 -->
    <div id="practiceContainer" class="practice-container" style="display: none;">
      <div class="practice-card-wrapper">
        <!-- 顶部导航 -->
        <div class="card-nav-header">
          <button class="nav-btn" id="prevSentenceBtn" aria-label="上一句">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <div class="card-progress">
            <span id="sentenceCounter">1/7</span>
            <span style="margin: 0 8px;">|</span>
            <span id="courseTitle">Lesson 1-2</span>
          </div>
          <button class="nav-btn" id="nextSentenceBtn" aria-label="下一句">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
        
        <!-- 卡片内容区 -->
        <div class="card-content" id="cardContent">
          <!-- 动态渲染题目 -->
        </div>
        
        <!-- 底部操作区 -->
        <div class="card-actions">
          <button class="btn-secondary" id="exitPracticeBtn" onclick="exitPractice()">
            退出练习
          </button>
          <button class="btn-primary" id="submitAnswerBtn" style="display: none;">
            提交答案
          </button>
        </div>
      </div>
    </div>

  <!-- 学习报告弹窗 -->
  <dialog id="reportDialog" class="pwa-dialog">
    <div class="pwa-dialog-content" style="max-width: 600px;">
      <div class="dialog-header-row">
        <h3>📈 学习报告</h3>
        <button class="close-icon" onclick="document.getElementById('reportDialog').close()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="reportDialogContent" class="report-content">
        <!-- 动态生成 -->
      </div>
    </div>
  </dialog>

  <script src="js/version-manager.js?v=20260528"></script>
  <script src="js/toast.js?v=20260528"></script>
  <script src="js/user-manager.js?v=20260528"></script>
  <script src="js/sf-icons.js?v=20260528"></script>
  <script src="js/data-sync.js?v=20260528"></script>
  <script src="js/review-system.js?v=20260528"></script>
  <script src="js/course-practice-engine.js?v=20260529"></script>
  <script>
    // 页面加载
    document.addEventListener('DOMContentLoaded', async () => {
      // 等待全局实例初始化
      await new Promise(resolve => {
        const checkInit = () => {
          if (window.reviewSystem && window.PracticeEngine) {
            resolve();
          } else {
            setTimeout(checkInit, 50);
          }
        };
        checkInit();
      });
      
      // 更新 UI
      updateLearningOverview();
      updatePracticeStats();
      updateReportPreview();
      
      // 绑定事件
      document.getElementById('notificationBtn')?.addEventListener('click', () => {
        toast.info('复习提醒功能已移除');
      });
      
      // 键盘支持
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          window.exitPractice();
        }
      });
    });

    // 更新学习概览
    function updateLearningOverview() {
      const stats = reviewSystem.getLearningStats();
      
      document.getElementById('streakDays').textContent = stats.streak + '天';
      document.getElementById('masteredCount').textContent = stats.mastered + '课';
      document.getElementById('avgAccuracy').textContent = stats.avgAccuracy + '%';
    }

    // 更新练习统计
    function updatePracticeStats() {
      const stats = reviewSystem.getPracticeStats();
      
      // 更新各题型数据
      Object.entries(stats).forEach(([type, data]) => {
        const starsEl = document.getElementById(`${type}Stars`);
        const remainingEl = document.getElementById(`${type}Remaining`);
        
        if (starsEl) {
          const starCount = Math.round(data.accuracy / 20);
          starsEl.textContent = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
        }
        
        if (remainingEl) {
          remainingEl.textContent = `剩余${data.remaining}课`;
        }
      });
    }

    // 更新报告预览
    function updateReportPreview() {
      const container = document.getElementById('reportPreview');
      const stats = reviewSystem.getLearningStats();
      
      container.innerHTML = `
        <div class="report-preview-item">
          <span class="label">本周学习</span>
          <span class="value">${stats.weeklyMinutes}分钟</span>
        </div>
        <div class="report-preview-item">
          <span class="label">掌握进度</span>
          <span class="value">${stats.mastered}/${stats.total}课</span>
        </div>
      `;
    }

    // 显示学习报告
    function showReport() {
      const container = document.getElementById('reportDialogContent');
      const stats = reviewSystem.getLearningStats();
      
      container.innerHTML = `
        <div class="report-section">
          <h3>📊 本周学习</h3>
          <div class="weekly-chart">
            ${stats.weeklyData.map((min, i) => `
              <div class="bar-item">
                <div class="bar" style="height: ${min / 2}px;"></div>
                <span class="label">${['一', '二', '三', '四', '五', '六', '日'][i]}</span>
                <span class="value">${min}m</span>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="report-section">
          <h3>🧠 记忆进度</h3>
          <div class="memory-progress">
            <div class="progress-item">
              <span class="label">新学</span>
              <div class="progress-bar">
                <div class="fill" style="width: ${stats.newPercent}%"></div>
              </div>
              <span class="value">${stats.newCount}句</span>
            </div>
            <div class="progress-item">
              <span class="label">复习中</span>
              <div class="progress-bar">
                <div class="fill" style="width: ${stats.reviewingPercent}%"></div>
              </div>
              <span class="value">${stats.reviewingCount}句</span>
            </div>
            <div class="progress-item">
              <span class="label">已掌握</span>
              <div class="progress-bar">
                <div class="fill" style="width: ${stats.masteredPercent}%"></div>
              </div>
              <span class="value">${stats.mastered}句</span>
            </div>
          </div>
        </div>
        
        <div class="report-section">
          <h3>📝 题型正确率</h3>
          <div class="accuracy-list">
            ${Object.entries(stats.typeAccuracy).map(([type, acc]) => `
              <div class="accuracy-item">
                <span class="type">${getTypeName(type)}</span>
                <div class="progress-bar">
                  <div class="fill" style="width: ${acc}%"></div>
                </div>
                <span class="value">${acc}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      document.getElementById('reportDialog').showModal();
    }

    function getTypeName(type) {
      const names = {
        listening: '🎧 听力',
        fillBlank: '✍️ 拼写',
        ordering: '🔀 排序',
        translation: '🌐 翻译',
        speaking: '🎤 口语'
      };
      return names[type] || type;
    }
    
    // 解析 URL 参数，支持直接打开单句练习
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sentenceId = params.get('sentence');
      const en = params.get('en');
      const zh = params.get('zh');
      const audio = params.get('audio');
      
      if (sentenceId && en) {
        // 直接练习模式：从 URL 参数加载句子
        console.log('[Practice Mode] Direct practice:', { sentenceId, en, zh, audio });
        
        // 初始化练习引擎
        if (window.PracticeEngine) {
          const engine = new PracticeEngine();
          const sentence = {
            id: sentenceId,
            sentence: en,
            translation: zh,
            audio: audio
          };
          engine.init('review', [sentence]);
        }
      }
    });
  </script>
</body>
</html>
