<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>收藏 - Shadowing App</title>
  <link rel="stylesheet" href="css/style.css?v=20260604-3">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-144.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    /* 收藏页面顶部导航栏 */
    .favorite-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      padding: 0 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: 12px;
      background: var(--card-solid);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .favorite-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .favorite-header-actions {
      display: flex;
      gap: 8px;
    }

    .favorite-header-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .favorite-header-btn:hover {
      background: var(--bg-secondary);
    }

    .favorite-content {
      padding: calc(44px + max(12px, env(safe-area-inset-top)) + 16px) 16px 80px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 搜索栏 */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    /* 收藏列表 */
    .favorite-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .favorite-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border);
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
    }

    .favorite-card:active {
      transform: scale(0.97);
    }

    .favorite-lesson {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .favorite-sentence {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .favorite-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .favorite-date {
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    .favorite-actions {
      display: flex;
      gap: 8px;
    }

    .favorite-action-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border: none;
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .favorite-action-btn:hover {
      background: var(--border);
    }

    .favorite-action-btn:active {
      transform: scale(0.95);
    }

    .favorite-action-btn.play {
      background: var(--primary);
      color: white;
    }

    .favorite-action-btn.delete {
      color: #ff5252;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      color: var(--text-tertiary);
    }

    .empty-state-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .empty-state-desc {
      font-size: 0.95rem;
      color: var(--text-tertiary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .empty-state-action {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .empty-state-action:active {
      opacity: 0.8;
    }

    /* 统计信息 */
    .favorite-stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .favorite-stat {
      flex: 1;
      padding: 16px;
      background: var(--card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      text-align: center;
    }

    .favorite-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .favorite-stat-label {
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }

    /* 响应式 */
    @media (min-width: 768px) {
      .favorite-content {
        padding: calc(44px + 16px) 24px 80px;
      }

      .favorite-list {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .favorite-card {
        padding: 20px;
      }
    }

    @media (max-width: 479px) {
      .favorite-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 收藏页面顶部导航栏 -->
  <header class="favorite-header">
    <h1>收藏</h1>
    <div class="favorite-header-actions">
      <button class="favorite-header-btn" onclick="sortFavorites()" aria-label="排序">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M6 12h12M9 18h6"/>
        </svg>
      </button>
      <button class="favorite-header-btn" onclick="exportFavorites()" aria-label="导出">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 收藏页面内容 -->
  <main class="favorite-content">
    <!-- 统计信息 -->
    <div class="favorite-stats">
      <div class="favorite-stat">
        <div class="favorite-stat-value" id="favoriteCount">0</div>
        <div class="favorite-stat-label">总收藏</div>
      </div>
      <div class="favorite-stat">
        <div class="favorite-stat-value" id="favoriteLessons">0</div>
        <div class="favorite-stat-label">涉及课程</div>
      </div>
      <div class="favorite-stat">
        <div class="favorite-stat-value" id="favoriteToday">0</div>
        <div class="favorite-stat-label">今日新增</div>
      </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索收藏的句子..." oninput="filterFavorites()">
    </div>

    <!-- 收藏列表 -->
    <div class="favorite-list" id="favoriteList">
      <!-- 动态渲染 -->
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <h3 class="empty-state-title">暂无收藏</h3>
      <p class="empty-state-desc">播放课文时点击句子右侧的星星图标，收藏喜欢的句子</p>
      <button class="empty-state-action" onclick="window.location.href='index.html'">去浏览课程</button>
    </div>
  </main>

  <!-- 底部导航栏 -->
  <nav id="bottomNav" class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="学习">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span class="nav-label">学习</span>
    </a>
    <a href="favorite.html" class="nav-item active" aria-label="收藏">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span class="nav-label">收藏</span>
    </a>
    <a href="stats.html" class="nav-item" aria-label="统计">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20V10"/>
        <path d="M18 20V4"/>
        <path d="M6 20v-4"/>
      </svg>
      <span class="nav-label">统计</span>
    </a>
    <a href="settings.html" class="nav-item" aria-label="设置">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="nav-label">设置</span>
    </a>
  </nav>

  <script src="js/favorite.js?v=20260604-3"></script>
</body>
</html>
