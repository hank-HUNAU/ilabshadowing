<!DOCTYPE html>
<html lang="zh-CN">
<!-- v20260514-2 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007aff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hankilab 学习中心">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23007aff'/><text x='256' y='320' font-size='280' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>N</text></svg>">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>N</text></svg>">
  <title>Hankilab 学习中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 首页：课本选择 -->
    <main id="bookSelectPage" class="book-page">
      <header class="top-bar">
        <h1 class="site-title">HANKILAB 学习中心</h1>
        <button id="showFavorites" class="icon-btn" aria-label="我的收藏" title="我的收藏">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <span id="favCountBadge" class="fav-badge" style="display: none;">0</span>
        </button>
      </header>
      <section id="bookGrid" class="book-grid"></section>
    </main>

    <!-- 课程列表页：课本形式 -->
    <main id="unitListPage" class="unit-page" style="display: none;">
      <header class="top-bar">
        <button id="backToBooks" class="back-btn" aria-label="返回课本选择">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="back-btn-label">课本选择</span>
        <h1 id="bookTitle" class="site-title">课本名称</h1>
        <span id="unitCount" class="unit-count">0 课</span>
      </header>
      <section id="unitGrid" class="unit-grid"></section>
    </main>

    <!-- 收藏页 -->
    <main id="favoritePage" class="unit-page" style="display: none;">
      <header class="top-bar">
        <button id="backToBooksFromFav" class="back-btn" aria-label="返回课本选择">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="back-btn-label">课本选择</span>
        <h1 class="site-title">我的收藏</h1>
        <span id="favoriteCount" class="unit-count">0 课</span>
      </header>
      <section id="favoriteGrid" class="unit-grid"></section>
    </main>

    <!-- 沉浸式播放弹窗 -->
    <dialog id="playerDialog" class="player-dialog">
      <div class="dialog-inner">
        <!-- 弹窗头部 -->
        <header class="dialog-header">
          <button id="closeBtn" class="icon-btn close-icon" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
          <h2 id="unitTitle" class="dialog-title">课文标题</h2>
          <div class="nav-group">
            <button id="prevBtn" class="icon-btn nav-icon" aria-label="上一课">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <button id="nextBtn" class="icon-btn nav-icon" aria-label="下一课">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <button id="expandBtn" class="icon-btn expand-icon" aria-label="全屏模式">
              <svg class="ico-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
              </svg>
              <svg class="ico-shrink" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M4 14h6v-6M20 10h-6v6M14 4l7 7M10 20l-7-7"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- 歌词区域 -->
        <section id="lyricsArea" class="lyrics-scroll"></section>

        <!-- 底部控制栏 -->
        <footer class="player-footer">
          <div class="progress-row">
            <span id="curTime" class="time-text">0:00</span>
            <div id="progressTrack" class="track-bar">
              <div id="progressFill" class="fill-bar"></div>
            </div>
            <span id="durTime" class="time-text">0:00</span>
          </div>
          
          <div class="controls-row">
            <button id="playBtn" class="ctrl-btn main-play" aria-label="播放">
              <svg class="ico-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg class="ico-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none">
                <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
              </svg>
            </button>
            
            <button id="repeatSingleBtn" class="ctrl-btn tag-btn" title="单句重复次数">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M17 1l4 4-4 4"/>
                <path d="M3 11V9a4 4 0 014-4h14"/>
                <path d="M7 23l-4-4 4-4"/>
                <path d="M21 13v2a4 4 0 01-4 4H3"/>
              </svg>
              <span id="repeatSingleCount">3</span>
            </button>
            
            <button id="repeatAllBtn" class="ctrl-btn tag-btn" title="全文重复次数">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M17 1l4 4-4 4"/>
                <path d="M3 11V9a4 4 0 014-4h14"/>
                <path d="M7 23l-4-4 4-4"/>
                <path d="M21 13v2a4 4 0 01-4 4H3"/>
              </svg>
              <span id="repeatAllCount">3</span>
            </button>
            
            <button id="modeBtn" class="ctrl-btn tag-btn" title="单句循环">
              <span id="modeLabel">单句</span>
            </button>
            
            <button id="speedBtn" class="ctrl-btn tag-btn" title="播放速度">
              <span id="speedLabel">1.0x</span>
            </button>
            
            <button id="transBtn" class="ctrl-btn tag-btn" title="显示模式">
              <span id="transLabel">双语</span>
            </button>
          </div>
        </footer>
      </div>
    </dialog>
    
    <!-- PWA 安装提示弹窗 -->
    <dialog id="pwaInstallDialog" class="pwa-dialog">
      <div class="pwa-dialog-content">
        <div class="pwa-icon">
          <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--primary)">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </div>
        <h3>添加到桌面</h3>
        <p>随时随地跟读英语，学习更方便</p>
        <div class="pwa-buttons">
          <button id="pwaInstallCancel" class="pwa-btn-secondary">暂不需要</button>
          <button id="pwaInstallConfirm" class="pwa-btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;margin-right:6px;vertical-align:middle">
              <path d="M4 4v15.62l11.07 3.22M20 4v15.62M4 18h16"/>
              <path d="M12 3v12m-4-4l4 4 4-4"/>
            </svg>
            立即添加
          </button>
        </div>
      </div>
    </dialog>
    
    <!-- 功能更新提示弹窗 -->
    <dialog id="updateDialog" class="pwa-dialog">
      <div class="pwa-dialog-content">
        <div class="pwa-icon">
          <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--primary)">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4m0 4h.01"/>
          </svg>
        </div>
        <h3>🎉 新功能上线</h3>
        <ul class="update-list">
          <li>✅ <strong>智能静音检测</strong> - 播放到句子末尾自动停止</li>
          <li>✅ <strong>三态显示模式</strong> - 双语/英文/中文循环切换</li>
          <li>✅ <strong>多端适配优化</strong> - 手机/平板/电脑完美适配</li>
          <li>✅ <strong>每句独立收藏</strong> - 点击星星收藏喜欢的句子</li>
        </ul>
        <div class="pwa-buttons">
          <button id="updateClose" class="pwa-btn-primary" style="width:100%">开始学习</button>
        </div>
      </div>
    </dialog>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="js/main.js"></script>
  
  <!-- PWA & 更新逻辑 -->
  <script>
    (function() {
      let deferredPrompt;
      const LS = {
        PWA_DISMISSED: 'nce_pwa_dismissed',
        VERSION: 'nce_app_version'
      };
      const APP_VERSION = '20260527';
      const UPDATE_SHOWN_KEY = 'nce_update_shown_' + APP_VERSION;
      
      window.addEventListener('load', function() {
        // 延迟显示 PWA 安装提示（3 秒后）
        if (!localStorage.getItem(LS.PWA_DISMISSED)) {
          setTimeout(function() {
            if (deferredPrompt && !document.getElementById('pwaInstallDialog').open) {
              document.getElementById('pwaInstallDialog').showModal();
            }
          }, 3000);
        }
        
        // 检查是否显示过更新提示
        const updateShown = localStorage.getItem(UPDATE_SHOWN_KEY);
        if (!updateShown) {
          setTimeout(function() {
            document.getElementById('updateDialog').showModal();
            localStorage.setItem(UPDATE_SHOWN_KEY, 'true');
            localStorage.setItem(LS.VERSION, APP_VERSION);
          }, 1000);
        }
      });
      
      // PWA 安装确认
      document.getElementById('pwaInstallConfirm')?.addEventListener('click', async function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const choiceResult = await deferredPrompt.userChoice;
          console.log('用户选择：', choiceResult.outcome);
          deferredPrompt = null;
          document.getElementById('pwaInstallDialog').close();
          if (choiceResult.outcome === 'accepted') {
            localStorage.setItem(LS.PWA_DISMISSED, 'true');
          }
        }
      });
      
      // PWA 安装取消
      document.getElementById('pwaInstallCancel')?.addEventListener('click', function() {
        localStorage.setItem(LS.PWA_DISMISSED, 'true');
        deferredPrompt = null;
        document.getElementById('pwaInstallDialog').close();
      });
      
      // 关闭更新提示
      document.getElementById('updateClose')?.addEventListener('click', function() {
        document.getElementById('updateDialog').close();
      });
      
      // 监听 PWA 安装事件
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        console.log('PWA 可安装');
      });
      
      // PWA 安装成功后
      window.addEventListener('appinstalled', function() {
        console.log('PWA 已安装');
        localStorage.setItem(LS.PWA_DISMISSED, 'true');
        deferredPrompt = null;
      });
    })();
  </script>
  
  <!-- 注册 Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('[SW] Service Worker registered:', reg.scope);
          })
          .catch(err => {
            console.log('[SW] Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
