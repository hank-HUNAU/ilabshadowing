<!DOCTYPE html>
<html lang="zh-CN">
<!-- v20260615-minimal -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#007aff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hankilab 学习中心">
  <link rel="apple-touch-icon" href="/ilabshadowing/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/ilabshadowing/icons/favicon.png" sizes="32x32">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="/ilabshadowing/icons/icon-96.png" sizes="96x96">
  <link rel="icon" type="image/png" href="/ilabshadowing/icons/icon-144.png" sizes="144x144">
  <link rel="icon" type="image/png" href="/ilabshadowing/icons/icon-512.png" sizes="512x512">
  <link rel="stylesheet" href="css/style.css?v=20260615-minimal">
</head>
<body>
  <!-- SVG 图标定义 -->
  <svg style="display: none;">
    <defs>
      <!-- 课本图标 -->
      <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </symbol>

      <!-- 返回箭头 -->
      <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 19l-7-7 7-7"/>
      </symbol>

      <!-- 播放图标 -->
      <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </symbol>

      <!-- 暂停图标 -->
      <symbol id="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </symbol>

      <!-- 上一曲图标 -->
      <symbol id="icon-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="19 20 9 12 19 4 19 20"/>
        <line x1="5" y1="19" x2="5" y2="5"/>
      </symbol>

      <!-- 下一曲图标 -->
      <symbol id="icon-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 4 15 12 5 20 5 4"/>
        <line x1="19" y1="5" x2="19" y2="19"/>
      </symbol>

      <!-- 重复图标 -->
      <symbol id="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 1l4 4-4 4"/>
        <path d="M3 11V9a4 4 0 014-4h14"/>
        <path d="M7 23l-4-4 4-4"/>
        <path d="M21 13v2a4 4 0 01-4 4H3"/>
      </symbol>

      <!-- 时钟图标 -->
      <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </symbol>

      <!-- 速度图标 -->
      <symbol id="icon-speed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </symbol>

      <!-- 翻译图标 -->
      <symbol id="icon-translate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 8l6 6"/>
        <path d="M4 14l6-6 2-3"/>
        <path d="M2 5h12"/>
        <path d="M7 2h1"/>
        <path d="M22 22l-5-10-5 10"/>
        <path d="M14 18h6"/>
      </symbol>

      <!-- 全屏图标 -->
      <symbol id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h6v6"/>
        <path d="M9 21H3v-6"/>
        <path d="M21 3l-7 7"/>
        <path d="M3 21l7-7"/>
      </symbol>

      <!-- 收起图标 -->
      <symbol id="icon-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 14h6v-6"/>
        <path d="M20 10h-6v6"/>
        <path d="M14 4l7 7"/>
        <path d="M10 20l-7-7"/>
      </symbol>

      <!-- 关闭图标 -->
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </symbol>

      <!-- 刷新图标 -->
      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </symbol>
    </defs>
  </svg>

  <!-- 电脑端侧边导航（仅保留学习入口） -->
  <aside id="sideNav" class="side-nav">
    <div class="side-nav-header">
      <div class="brand">
        <h1>HANKILAB</h1>
      </div>
    </div>
    <nav class="side-nav-menu">
      <a href="#" class="side-nav-item active" data-page="book" aria-label="学习">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>学习</span>
      </a>
    </nav>
  </aside>

  <div id="app">
    <!-- 首页：课本选择 -->
    <main id="bookSelectPage" class="book-page">
      <header class="top-bar">
        <h1 class="site-title">HANKILAB 学习中心</h1>
        <div class="header-actions">
          <!-- 用户按钮暂隐藏 -->
          <button id="userCenterBtn" class="icon-btn" aria-label="用户中心" title="用户中心" style="display:none">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M12 14c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/>
            </svg>
            <span id="userDisplayName" class="user-name"></span>
          </button>
        </div>
      </header>
      <section id="bookGrid" class="book-grid"></section>
    </main>

    <!-- 课程列表页 -->
    <main id="unitListPage" class="unit-page" style="display: none;">
      <header class="top-bar">
        <button id="backToBooks" class="back-btn" aria-label="返回课本选择">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="back-btn-label">课本选择</span>
        <h1 id="bookTitle" class="site-title">课本名称</h1>
        <span id="unitCount" class="unit-count">0 课</span>
      </header>
      
      <!-- 下拉刷新指示器 -->
      <div id="pullToRefresh" class="pull-to-refresh">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span class="refresh-text">下拉刷新</span>
      </div>
      
      <section id="unitGrid" class="unit-grid"></section>
    </main>

    <!-- 课文预习弹窗 -->
    <dialog id="playerDialog" class="player-dialog">
      <div class="dialog-inner">
        <!-- 弹窗头部 -->
        <header class="dialog-header">
          <button id="closeBtn" class="icon-btn close-icon" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
          <h2 id="unitTitle" class="dialog-title">课文预习</h2>
          <div class="nav-group">
            <button id="prevBtn" class="icon-btn nav-icon" aria-label="上一课">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <button id="nextBtn" class="icon-btn nav-icon" aria-label="下一课">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <button id="expandBtn" class="icon-btn expand-icon" aria-label="全屏模式">
              <svg class="ico-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
              </svg>
              <svg class="ico-shrink" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M4 14h6v-6M20 10h-6v6M14 4l7 7M10 20l-7-7"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- 歌词区域 -->
        <section id="lyricsArea" class="lyrics-scroll"></section>

        <!-- 底部控制栏 -->
        <footer class="player-footer">
          <div class="progress-row">
            <span id="curTime" class="time-text">0:00</span>
            <div id="progressTrack" class="track-bar" aria-label="进度条">
              <div class="track-bar-visual">
                <div id="progressFill" class="fill-bar"></div>
              </div>
              <div id="progressHandle" class="track-handle"></div>
            </div>
            <span id="durTime" class="time-text">0:00</span>
          </div>
          
<div class="controls-row">
            <button id="playBtn" class="ctrl-btn main-play" aria-label="播放">
              <svg class="ico-play" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
              <svg class="ico-pause" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
              </svg>
            </button>
            
            <button id="repeatBtn" class="ctrl-btn tag-btn" title="重复次数">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
              </svg>
              <span id="repeatCount">3</span>
            </button>
            
            <button id="timerBtn" class="ctrl-btn tag-btn" title="定时关闭">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              <span id="timerLabel">关闭</span>
            </button>
            
            <button id="modeBtn" class="ctrl-btn tag-btn" title="预习模式">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px">
                <path d="M3 3v18h18"/><path d="M18.5 7.5l-6 6-6-6"/>
              </svg>
              <span id="modeLabel">单句</span>
            </button>
            
            <button id="speedBtn" class="ctrl-btn tag-btn" title="播放速度">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px">
                <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 18a8 8 0 118-8 8 8 8 0 01 -8 8z"/><path d="M12 6v6l4 2"/>
              </svg>
              <span id="speedLabel">1.0x</span>
            </button>
            
            <button id="transBtn" class="ctrl-btn tag-btn" title="显示模式">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px">
                <path d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
              <span id="transLabel">双语</span>
            </button>
          </div>
        </footer>
      </div>
    </dialog>

    <!-- Toast 提示 -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Loading 遮罩 -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none">
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <p class="loading-text">加载中...</p>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="js/sf-icons.js?v=20260528"></script>
  <script src="js/data-sync.js?v=20260528"></script>
  <script src="js/version-manager.js?v=20260528"></script>
  <script src="js/toast.js?v=20260129-7"></script>
  <script src="js/user-manager.js?v=20260129-7"></script>
  <script src="js/review-system.js?v=20260528"></script>
  
  <!-- SPA 路由器 -->
  <script src="js/spa-router.js?v=20260615-minimal"></script>
  
  <!-- 主应用脚本 -->
  <script src="js/main.js?v=20260615-minimal"></script>
</body>
</html>
